services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://metrics:secret@db:5432/metrics_db
      - USE_DATABASE_METRICS=true
      - CACHE_TTL_METRICS=300
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=metrics-data
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=metrics
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=metrics_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cria o bucket automaticamente ao iniciar
  minio-setup:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/metrics-data --ignore-existing;
      mc anonymous set download local/metrics-data;
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal

  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    environment:
      - NODE_ENV=production
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://metrics:secret@db:5432/metrics_db
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - SYNC_INTERVAL_MINUTES=15
      - SYNC_MAX_CONCURRENT=5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - external
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  pgdata:
    driver: local
  minio-data:
    driver: local
